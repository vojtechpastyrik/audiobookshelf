name: Build image

on:
  push:
    branches: [patches]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=$(sed 's/^v//' .upstream-base)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Target NAS is x64 only; skipping arm64 keeps the build ~4x faster.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/audiobookshelf:latest
            ghcr.io/${{ github.repository_owner }}/audiobookshelf:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/audiobookshelf:${{ steps.v.outputs.version }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
